name: archero_fm
description: "A professional Archero clone with graphics and audio."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter_lints

flutter:
  uses-material-design: true

  # تعريف مجلدات الأصول للصور والأصوات
  assets:
    - assets/images/
    - assets/audio/
    
