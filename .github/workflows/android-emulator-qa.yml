name: Android Emulator QA

on:
  push:
    branches:
      - main
      - "feature-*"
      - "feature/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    name: Android emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner project
        run: flutter create --platforms=android --org com.fadimatar --project-name archero_fm .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run unit and widget tests
        run: flutter test --reporter expanded

      - name: Run app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            flutter test integration_test/app_smoke_test.dart -d emulator-5554 --reporter expanded
            mkdir -p artifacts
            adb exec-out screencap -p > artifacts/android-emulator-main-menu.png
            adb logcat -d -t 5000 > artifacts/android-emulator-logcat.txt

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence-${{ github.run_number }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
