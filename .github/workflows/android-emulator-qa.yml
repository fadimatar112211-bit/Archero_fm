name: Android Emulator QA

# Emulator validation is intentionally manual and runs at integrated milestones,
# not after every small subtask. Flutter CI continues to run automatically.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/visual-overhaul-home-hub

permissions:
  contents: read

concurrency:
  group: android-emulator-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    name: Android emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner project
        run: flutter create --platforms=android --org com.fadimatar --project-name archero_fm .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run unit and widget tests
        run: flutter test --reporter expanded

      - name: Run app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          script: |
            mkdir -p artifacts
            test_status=0
            flutter test integration_test/app_smoke_test.dart -d emulator-5554 --reporter expanded || test_status=$?
            adb exec-out screencap -p > artifacts/android-emulator-arena.png || true
            adb logcat -d -t 5000 > artifacts/android-emulator-logcat.txt || true
            exit $test_status

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence-${{ github.run_number }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
