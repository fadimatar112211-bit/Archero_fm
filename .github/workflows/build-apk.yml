name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          
      - name: Safe Clean pubspec.yaml
        run: |
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              lines = f.readlines()
          with open('pubspec.yaml', 'w') as f:
              for line in lines:
                  if 'flutter_test' not in line:
                      f.write(line)
          "
          
      - name: Create Clean Android Project & Fix Gradle Wrapper
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.fadimatar --project-name archero_fm
          
          mkdir -p android/gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          
      - name: Get Dependencies
        run: flutter pub get
          
      - name: Build Debug APK with Info Logs
        run: flutter build apk --debug --info
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          
