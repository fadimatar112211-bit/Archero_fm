name: Build Android APK

on:
  push:
    branches:
      - feature/procedural-game-audio-v2
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate clean Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.fadimatar --project-name archero_fm .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Install Android NDK with retry
        run: |
          NDK_VERSION="28.2.13676358"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            if yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "NDK installation failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: archero-fm-${{ github.ref_name }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Archero FM ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
