name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project when platform files are absent
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.fadimatar --project-name archero_fm .
          else
            echo "Existing Android project detected; preserving platform configuration."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Install Android NDK with retry
        run: |
          NDK_VERSION="28.2.13676358"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            if yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "NDK installation failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: archero-fm-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
