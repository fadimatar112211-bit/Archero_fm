name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          
      - name: Clean Test Dependencies from pubspec.yaml
        run: |
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              lines = f.readlines()
          with open('pubspec.yaml', 'w') as f:
              skip = False
              for line in lines:
                  if 'dev_dependencies:' in line:
                      f.write(line)
                      skip = True
                      continue
                  if skip and ('flutter_test' in line or 'sdk: flutter' in line):
                      continue
                  else:
                      skip = False
                      f.write(line)
          "
          
      - name: Pub Get and Verify Project
        run: |
          flutter clean
          flutter pub get
          
      - name: Build Debug APK Cleanly
        run: flutter build apk --debug
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          
