workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Setup and Build APK
        script: |
          # إذا لم يكن مجلد الأندرويد موجوداً، قم بإنشائه لمرة واحدة
          if [ ! -d "android" ]; then
            flutter create . --org com.example.archero --project-name archero_game
          fi
          flutter build apk --debug --no-pub
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
