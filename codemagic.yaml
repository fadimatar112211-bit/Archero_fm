workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Initialize Flutter Project Structure
        script: |
          flutter create . --org com.example.archero --project-name archero_game
          mkdir -p lib
      - name: Fix Code and Build APK
        script: |
          # التأكد من بناء الـ debug لتجاوز أي قيود فحص صارمة
          flutter build apk --debug --no-pub
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
