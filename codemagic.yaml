workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Initialize Project and Build APK
        script: |
          flutter create . --org com.example.archero --project-name archero_game
          mkdir -p lib
          flutter build apk --debug --no-pub
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
