workflows:
  android-workflow:
    name: Android Workflow
    environment:
      flutter: stable
    scripts:
      - name: Prepare Android project when platform files are absent
        script: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.fadimatar --project-name archero_fm .
          else
            echo "Existing Android project detected; preserving platform configuration."
          fi
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze Dart code
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        script: flutter test
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
